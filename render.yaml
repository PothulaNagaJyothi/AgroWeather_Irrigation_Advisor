services:
  # Backend Service
  - type: web
    name: agroweather-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run init-db && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SQLITE_FILE
        value: /opt/render/project/src/backend/database/agroweather.db

  # Frontend Service
  - type: web
    name: agroweather-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: agroweather-backend
          property: host

databases:
  # Render doesn't support persistent SQLite on free tier easily without disk,
  # but for this blueprint we rely on the file system (ephemeral on free tier).
  # For production persistence, use a managed Render PostgreSQL database.
